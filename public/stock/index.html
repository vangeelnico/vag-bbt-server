<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VAG Stock</title>
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAG Stock">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="modebar" class="modebar" hidden>INTERN · DEALERMODUS</div>
<header class="top">
  <div class="brand"><span class="logo">VAG</span><span class="brand-sub">Jonge tweedehands Mercedes-Benz</span></div>
  <div class="top-actions">
    <button id="btn-leads" class="icon-btn dealer-only" hidden aria-label="Leads"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0Zm-12 9c0-3.3 3.6-5 8-5s8 1.7 8 5"/></svg><span id="leads-count" class="count"></span></button>
    <button id="btn-refresh" class="icon-btn" aria-label="Vernieuwen"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button id="btn-mode" class="icon-btn mode-btn" data-mode aria-label="Wissel klant/dealer" aria-pressed="false"><svg class="eye-closed" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.5M6.2 7.3C4 9 3 12 3 12s4 6 9 6a8.8 8.8 0 0 0 4-1"/></svg><svg class="eye-open" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>

<main id="view-list" class="view">
  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Zoek op opties, bv. trekhaak pano 360" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="q-clear" class="clear" aria-label="Wissen" hidden>×</button>
    </div>
    <div class="result-line"><span id="count"></span><button id="btn-filters" class="link-btn">Filters</button><button id="btn-reset" class="link-btn" hidden>Alles wissen</button></div>
    <div id="filters" class="filters"></div>
  </section>
  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="status" class="status"></p>
</main>

<div id="comparebar" class="comparebar" hidden>
  <span id="fav-count"></span>
  <button id="btn-fav-clear" class="link-btn light">Leegmaken</button>
  <button id="btn-compare" class="btn yellow">Vergelijken</button>
</div>

<section id="view-detail" class="overlay" hidden aria-modal="true" role="dialog"></section>
<section id="view-compare" class="overlay" hidden aria-modal="true" role="dialog"></section>
<section id="view-leads" class="overlay" hidden aria-modal="true" role="dialog"></section>
<div id="lightbox" class="lightbox" hidden></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>

<section id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <span class="logo big">VAG</span>
    <h1>Stockviewer</h1>
    <p>Geef de toegangscode in.</p>
    <input id="login-code" type="password" inputmode="text" autocomplete="current-password" placeholder="Toegangscode" required>
    <button type="submit" class="btn blue">Inloggen</button>
    <p id="login-err" class="err" hidden></p>
  </form>
</section>
</body>
</html>
